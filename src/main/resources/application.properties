server.port=${PORT:8081}
spring.application.name=rosca-system

# Error Handling Security
server.error.include-stacktrace=never
server.error.include-message=always

# Database Configuration (Connected directly to Neon PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-round-thunder-ayquf59r-pooler.c-5.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS Allowed Origins Config
allowed.origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:3000}

# JWT Authentication Config
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm123}
jwt.expiration=${JWT_EXPIRATION:86400000}
